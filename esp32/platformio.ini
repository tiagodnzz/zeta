; Projeto PlatformIO: controlador de servos para o ESP32
; Recebe comandos via Serial (USB) do Raspberry Pi e move os servos
; usando PWM em hardware (LEDC) - sem jitter, independente de carga de CPU.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    bodmer/TFT_eSPI

; Configuracao do display TFT ST7789V2 240x280 via build_flags,
; sem precisar editar User_Setup.h da biblioteca TFT_eSPI.
; Se as cores saírem trocadas (vermelho/azul invertidos), troque
; TFT_RGB_ORDER para TFT_BGR. Servos ficaram em GPIO25/26 para liberar
; o barramento VSPI padrao (18/23/5) para a tela.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_SCLK=18
    -DTFT_MOSI=23
    -DTFT_CS=5
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1